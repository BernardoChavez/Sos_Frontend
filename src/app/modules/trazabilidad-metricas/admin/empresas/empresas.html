<div class="max-w-6xl mx-auto p-6 animate-in">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-3xl font-black text-slate-900">Empresas (Tenants)</h2>
  </div>

  <div *ngIf="loading" class="text-slate-500 py-8 text-center flex flex-col items-center gap-3">
    <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    <span>Cargando empresas...</span>
  </div>
  
  <div *ngIf="error" class="text-red-600 bg-red-50 p-4 rounded-xl border border-red-100 mb-4 font-medium">{{ error }}</div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden" *ngIf="!loading && !error">
    <table class="w-full text-left border-collapse">
      <thead class="bg-slate-50/80 border-b border-slate-100">
        <tr>
          <th class="px-5 py-3 text-[11px] font-black text-slate-400 uppercase tracking-wider">ID</th>
          <th class="px-5 py-3 text-[11px] font-black text-slate-400 uppercase tracking-wider">Nombre</th>
          <th class="px-5 py-3 text-[11px] font-black text-slate-400 uppercase tracking-wider">Slug</th>
          <th class="px-5 py-3 text-[11px] font-black text-slate-400 uppercase tracking-wider">Suscripción</th>
          <th class="px-5 py-3 text-[11px] font-black text-slate-400 uppercase tracking-wider">Estado</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        <tr *ngFor="let e of empresas" class="hover:bg-slate-50/50 transition-colors">
          <td class="px-5 py-4 font-bold text-slate-400">#{{ e.id }}</td>
          <td class="px-5 py-4 font-bold text-slate-800">{{ e.nombre }}</td>
          <td class="px-5 py-4 font-medium text-slate-500">{{ e.slug }}</td>
          <td class="px-5 py-4 font-bold text-blue-600">{{ e.suscripcion?.nombre ?? 'Sin plan' }}</td>
          <td class="px-5 py-4">
            <span class="px-3 py-1.5 rounded-xl text-[11px] font-black uppercase tracking-wider"
              [ngClass]="{'bg-emerald-100 text-emerald-700 border border-emerald-200': e.esta_activa, 'bg-rose-100 text-rose-700 border border-rose-200': !e.esta_activa}">
              {{ e.esta_activa ? 'Activa' : 'Inactiva' }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
    
    <div *ngIf="empresas.length === 0" class="text-slate-400 text-center py-10 font-medium">
      No hay empresas registradas.
    </div>
  </div>
</div>
