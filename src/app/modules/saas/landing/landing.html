<div class="min-h-screen bg-slate-900 text-slate-50 relative overflow-hidden font-['Outfit']">
  <div class="hero-glow"></div>

  <!-- Navbar -->
  <nav class="glass-nav fixed w-full z-50 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center shadow-lg shadow-blue-500/30">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        <span class="text-xl font-black tracking-tight text-white italic">SOS <span class="text-blue-400">AUTOMOTRIZ</span></span>
      </div>
      
      <div class="hidden md:flex items-center gap-6">
        <button (click)="iniciarSesion()" class="text-sm font-semibold text-slate-300 hover:text-white transition-colors">
          Portal Clientes
        </button>
        <div class="h-6 w-px bg-slate-700"></div>
        <div class="relative group">
          <select [(ngModel)]="empresaSeleccionada" class="bg-slate-800/50 border border-slate-700 text-sm rounded-full py-2 px-5 pr-10 text-slate-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all w-64 appearance-none">
            <option value="" disabled selected>Selecciona tu empresa</option>
            <option *ngFor="let emp of empresas" [value]="emp.slug">{{ emp.nombre }}</option>
          </select>
          <button (click)="irAEmpresa()" [disabled]="!empresaSeleccionada" class="absolute right-2 top-1.5 p-1 text-slate-400 hover:text-blue-400 disabled:opacity-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <main class="relative pt-32 pb-16 sm:pt-40 sm:pb-24 lg:pb-32 px-6">
    <div class="max-w-7xl mx-auto text-center">
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-sm font-semibold mb-8 animate-in">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
        </span>
        La red de talleres más avanzada
      </div>

      <h1 class="text-5xl sm:text-7xl font-black tracking-tighter mb-8 bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent animate-in" style="animation-delay: 100ms;">
        Gestión Automotriz<br>
        <span class="italic font-light">Llevada al Futuro</span>
      </h1>
      
      <p class="max-w-2xl mx-auto text-lg sm:text-xl text-slate-400 mb-12 animate-in font-light" style="animation-delay: 200ms;">
        Únete a la plataforma SaaS líder. Administra tu taller, recibe emergencias con inteligencia artificial y aumenta tus ingresos exponencialmente.
      </p>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-5 animate-in" style="animation-delay: 300ms;">
        <button (click)="irAPlanes()" class="w-full sm:w-auto px-8 py-4 bg-gradient-to-br from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-bold rounded-2xl transition-all shadow-lg shadow-blue-500/25 active:scale-95 flex items-center justify-center gap-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
          Registrar mi Taller
        </button>
        
        <button (click)="pedirAuxilio()" class="w-full sm:w-auto px-8 py-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold rounded-2xl transition-all shadow-lg active:scale-95 flex items-center justify-center gap-3 group">
          <div class="w-2 h-2 rounded-full bg-red-500 group-hover:animate-pulse"></div>
          ¡Pedir Auxilio Ahora!
        </button>
      </div>
    </div>
  </main>
</div>
